<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Oxygen Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&display=swap" rel="stylesheet">
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="styles/main.css">
    <title>GoDrive</title>
</head>
<body>
    <section class="side">
        <img src="Images/logo.png" alt="logo">
    </section>
    <section class="main">
        <div class="login-container">
            <p class="title">INICIO DE SESIÓN</p>
            <div class="separator"></div>
            <p class="welcome-message">Por favor,ingresa tus credenciales para acceder al sistema</p>
            <form action="" id="login-form" class="login-form">
                <div class="form-control">
                    <input type="text" id="username" placeholder="Nombre de usuario">
                </div>
                <div class="form-control">
                    <input type="password" id="password" placeholder="Contraseña">
                </div>
                <button type="submit" class="submit">Iniciar Sesión</button>
            </form>
        </div>
    </section>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
