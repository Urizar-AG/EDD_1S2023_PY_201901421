<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/administrador.css">
    <title>PanelAdministrador</title>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <div class="logo">
                <img src="../Images/logo2.png" alt="logo">
            </div>
            <div class="separator"> </div>
            <div class="logout">
                <button id="logout">Cerrar Sesión</button>
            </div>
        </div>

        <div class="side">
            <div>
                <select id="recorrido">
                    <option value="inorden" selected>Inorden</option>
                    <option value="preorden">Preorden</option>
                    <option value="postorden">Postorden</option>
                </select>
                <button class="btn" id="ver-alumnos">Ver Alumnos</button>
            </div>
            <div>
                <button class="btn" id="ver-arbol">Árbol de Estudiantes</button>
            </div>
            <div>
                <input type="file" id="input-file" accept="application/json">
                <button  type="button" id="carga-masiva">Carga Masiva</button>
            </div>
        </div>

        <div class="table-container">
            <h3>Estudiantes</h3>
            <table>
                <thead>
                    <tr>
                        <td>Carnet</td>
                        <td>Nombre</td>
                    </tr>
                </thead>
                <tbody id="body-table">
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="../scripts/administrador.js"></script>
</body>
</html>
