<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanelAdministrador</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&display=swap" rel="stylesheet">
    <!-- Simbolos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilo -->
    <link rel="stylesheet" href="../styles/administrador.css">
</head>
<body>
    <div class="side">
        <h1>
            <img src="../Images/logo2.png" alt="logo">
        </h1>
        <ul>
            <li>
                <button type="button" id="ver-mensajes"><i class="fa-solid fa-message"></i></button>
                Ver Mensajes
            </li>
            <li>
                <button type="button" id="reporte-mensajes"><i class="fa-solid fa-file-export"></i></button>
                Reporte Mensajes
            </li>
            <li>
                <button type="button" id="logout"><i class="fa-solid fa-right-from-bracket"></i></button>
                Cerrar Sesión
            </li>
        </ul>
        <button class="btn" id="ocultar">
            <i class="fas fa-chevron-right"></i>
            <i class="fas fa-chevron-left"></i>
        </button>
    </div>
    <div class="main-container">
        <div class="table-container" id="students">
            <h3>Estudiantes</h3>
            <span class="separator">Estudiantes</span>
            <table>
                <thead>
                    <tr>
                        <td>Carnet</td>
                        <td>Nombre</td>
                        <td>Contraseña</td>
                    </tr>
                </thead>
                <tbody id="body-table">
                </tbody>
            </table>
        </div>
        <div class="table-container" id="permissions">
            <h3>Permisos</h3>
            <span class="separator">Permisos</span>
            <table>
                <thead>
                    <tr>
                        <td>Propietario</td>
                        <td>Destino</td>
                        <td>Ubicación</td>
                        <td>Archivo</td>
                        <td>Permiso</td>
                    </tr>
                </thead>
                <tbody id="body-table2">
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="../scripts/administrador.js"></script>
</body>
</html>
