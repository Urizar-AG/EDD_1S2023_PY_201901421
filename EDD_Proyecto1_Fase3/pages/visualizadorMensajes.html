<!-- Visualizador de la block chain para el administrador -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mensajeria</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/visualizadorMensajes.css">

</head>
<body>
    <div class="container">
        <div class="header-container">
            <div class="logo">
                <img src="../Images/logo2.png" alt="logo">
            </div>
        </div>
        <div class="block-container">
            <textarea id="data-container" cols="150" disabled></textarea>
        </div>
        <div class="button-container">
            <button id="btn-prev">Anterior</button>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>    
    <script type="module" src="../scripts/visualizadorMensaje.js"></script>
</body>
</html>
